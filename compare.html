<script>
function getPreferredTheme(){
return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
}

function applyTheme(theme){
currentTheme=theme
document.documentElement.dataset.theme=theme
try{
localStorage.setItem("theme",theme)
}catch(error){
}
updateThemeSwitch()
}

function switchTheme(){
applyTheme(currentTheme==="dark" ? "light" : "dark")
}

function updateThemeSwitch(){
let switchButton=document.getElementById("theme_switch")
switchButton.className="theme-switch " + currentTheme
switchButton.setAttribute("aria-pressed",currentTheme==="dark" ? "true" : "false")
switchButton.setAttribute("aria-label",currentTheme==="dark" ? text[currentLang].theme.lightAria : text[currentLang].theme.darkAria)
}

function switchLang(){
currentLang=currentLang==="en" ? "zh" : "en"
document.documentElement.lang=currentLang
updateText()
}

let currentLang=location.pathname.startsWith("/zh") ? "zh" : "en"
let currentTheme=document.documentElement.dataset.theme || getPreferredTheme()

const text={
en:{
title:"AI Model Version Comparison",
subtitle:"Choose any two companies, model families, or exact versions, then compare them across benchmark-style task domains.",
badge:"Model lab",
home:"Browse",
compare:"Compare",
about:"About",
contact:"Contact",
submit:"Submit tool",
left:"Compare side A",
right:"Compare side B",

const metricIconClass={code:"code",agent:"reason",vision:"multi",docs:"write",context:"reason",instruct:"write",efficiency:"speed",safety:"reason",open:"open"}

function escapeHtml(value){
return String(value).replace(/[&<>"']/g,character=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[character]))
}

function groupedModels(){
return [...new Set(models.map(model=>model.company))].map(company=>({
company,
items:models.filter(model=>model.company===company)
}))
}

function updateText(){
let t=text[currentLang]
document.getElementById("title").innerText=t.title
document.getElementById("subtitle").innerText=t.subtitle
document.getElementById("nav_badge").innerText=t.badge
document.getElementById("nav_home").innerText=t.home
document.getElementById("nav_compare").innerText=t.compare
document.getElementById("nav_about").innerText=t.about
document.getElementById("nav_contact").innerText=t.contact
document.getElementById("nav_submit").innerText=t.submit
document.getElementById("theme_light").innerText=t.theme.light
document.getElementById("theme_dark").innerText=t.theme.dark
document.getElementById("left_label").innerText=t.left
document.getElementById("right_label").innerText=t.right
document.getElementById("versus").innerText=t.versus
document.getElementById("catalog_title").innerText=t.catalogTitle
document.getElementById("catalog_subtitle").innerText=t.catalogSubtitle
document.getElementById("footer").innerText=t.footer
document.getElementById("lang_switch").className="lang-switch " + currentLang
updateThemeSwitch()
renderSelectors()
renderCompanyFilter()
renderComparison()
renderCatalog()
}

function renderSelectors(){
let leftSelect=document.getElementById("compare_left")
let rightSelect=document.getElementById("compare_right")
let leftValue=leftSelect.value || "gpt-5-5"
let rightValue=rightSelect.value || "opus-4-7"
let options=groupedModels().map(group=>{
let items=group.items.map(model=>{
let label=`${model.version} · ${model.family}`
return `<option value="${escapeHtml(model.id)}">${escapeHtml(label)}</option>`
}).join("")
return `<optgroup label="${escapeHtml(group.company)}">${items}</optgroup>`
}).join("")
leftSelect.innerHTML=options
rightSelect.innerHTML=options
leftSelect.value=models.some(model=>model.id===leftValue) ? leftValue : "gpt-5-5"
rightSelect.value=models.some(model=>model.id===rightValue) ? rightValue : "opus-4-7"
}

function renderCompanyFilter(){
let select=document.getElementById("company_filter")
let currentValue=select.value || "All"
let companies=[...new Set(models.map(model=>model.company))]
select.innerHTML=`<option value="All">${escapeHtml(text[currentLang].allCompanies)}</option>` + companies.map(company=>`<option value="${escapeHtml(company)}">${escapeHtml(company)}</option>`).join("")
select.value=companies.includes(currentValue) ? currentValue : "All"
}

function getModel(id){
return models.find(model=>model.id===id) || models[0]
}

function renderComparison(){
let leftSelect=document.getElementById("compare_left")
let rightSelect=document.getElementById("compare_right")
if(!leftSelect.options.length || !rightSelect.options.length){
renderSelectors()
}
let leftModel=getModel(leftSelect.value)
let rightModel=getModel(rightSelect.value)
document.getElementById("compare_output").innerHTML=renderModelCard(leftModel) + renderModelCard(rightModel)
}

function renderModelCard(model){
let t=text[currentLang]
let summary=model.summary[currentLang] || model.summary.en
let tags=(model.bestFor[currentLang] || model.bestFor.en).map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join("")
let metrics=Object.keys(t.metrics).map(metricKey=>{
let value=model.metrics[metricKey] || 0
let iconClass=metricIconClass[metricKey] || "reason"
return `
<div class="metric">
<span class="metric-icon ${iconClass}" aria-hidden="true"></span>
<span class="metric-label">${escapeHtml(t.metrics[metricKey])}</span>
<span class="metric-track"><span class="metric-fill" style="--value:${value}"></span></span>
<span class="metric-score">${value.toFixed(1)}</span>
</div>
`
}).join("")
let basis=model.basis[currentLang] || model.basis.en

return `
<article class="model-card">
<div class="model-top">
<div class="model-logo">${escapeHtml(model.initials)}</div>
<div>
<h2>${escapeHtml(model.version)}</h2>
<div class="model-meta">${escapeHtml(model.company)} · ${escapeHtml(model.family)}</div>
</div>
</div>
<p class="model-note">${escapeHtml(summary)}</p>
<div class="tags" aria-label="${escapeHtml(t.bestFor)}">${tags}</div>
<div class="metrics">${metrics}</div>
<p class="source-note"><strong>${escapeHtml(t.sourceLabel)}:</strong> ${escapeHtml(basis)}</p>
</article>
`
}

function renderCatalog(){
let selectedCompany=document.getElementById("company_filter").value || "All"
let companies=groupedModels().filter(group=>selectedCompany==="All" || group.company===selectedCompany)
let cards=companies.map(group=>{
let rows=group.items.map(model=>{
let total=Object.values(model.metrics).reduce((sum,value)=>sum+value,0)
let average=(total/Object.keys(model.metrics).length).toFixed(1)
let summary=model.summary[currentLang] || model.summary.en
return `
<div class="version-row">
<div>
<strong>${escapeHtml(model.version)}</strong>
<span>${escapeHtml(summary)}</span>
</div>
<span class="score-badge">${average}</span>
</div>
`
}).join("")
return `
<article class="version-card">
<h3>${escapeHtml(group.company)}</h3>
<div class="version-list">${rows}</div>
</article>
`
}).join("")
document.getElementById("catalog_grid").innerHTML=cards
}
