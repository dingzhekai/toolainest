<script>
function getPreferredTheme(){
return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
}

function applyTheme(theme){
currentTheme=theme
document.documentElement.dataset.theme=theme
try{
localStorage.setItem("theme",theme)
}catch(error){
}
updateThemeSwitch()
}

function switchTheme(){
applyTheme(currentTheme==="dark" ? "light" : "dark")
}

function updateThemeSwitch(){
let switchButton=document.getElementById("theme_switch")
switchButton.className="theme-switch " + currentTheme
switchButton.setAttribute("aria-pressed",currentTheme==="dark" ? "true" : "false")
switchButton.setAttribute("aria-label",currentTheme==="dark" ? text[currentLang].theme.lightAria : text[currentLang].theme.darkAria)
}

function switchLang(){
currentLang=currentLang==="en" ? "zh" : "en"
document.documentElement.lang=currentLang
updateText()
renderControls()
renderPrices()
}

let currentLang=location.pathname.startsWith("/zh") ? "zh" : "en"
let currentTheme=document.documentElement.dataset.theme || getPreferredTheme()
let priceModels=[]

const workloads={
chat:{input:1000000,cached:0,output:250000},
agent:{input:3000000,cached:1000000,output:800000},
coding:{input:2000000,cached:500000,output:1000000}
}

const text={
en:{
title:"AI Token Price Explorer",
subtitle:"Compare model costs without digging through provider tables: input, output, cache reads, cache writes, context, and a sample workload cost.",
badge:"Token prices",
home:"Browse",
compare:"Compare",
prices:"Prices",
about:"About",
contact:"Contact",
submit:"Submit tool",
panelTitle:"Token pricing by model",
panelSubtitle:"Prices are normalized to USD per 1M tokens. The model cards are calibrated from the public OfoxAI Models API.",
provider:"Provider",
workload:"Sample workload",
allProviders:"All providers",
source:"Source: OfoxAI public Models API. Prices can change; verify before production use.",
footer:"© 2026 AI Tools Directory",
theme:{light:"Light",dark:"Dark",lightAria:"Switch to light mode",darkAria:"Switch to dark mode"},
labels:{input:"Input",output:"Output",cached:"Cached read",cache5m:"Cache write",cache1h:"1h cache",search:"Search",context:"Context",maxOutput:"Max output",example:"Example",loading:"Loading price data..."},
workloads:{chat:"Chat: 1M input + 250K output",agent:"Agent: 3M input + 1M cached + 800K output",coding:"Coding: 2M input + 500K cached + 1M output"}
},
zh:{
title:"AI Token 价格查询",
subtitle:"不用翻各家表格，直接对比输入、输出、缓存读取、缓存写入、上下文和示例任务成本。",
badge:"Token 价格",
home:"浏览",
compare:"对比",
prices:"价格",
about:"关于",
contact:"联系",
submit:"提交工具",
panelTitle:"按模型查看 Token 定价",
panelSubtitle:"价格统一换算为美元 / 100 万 tokens。模型卡片根据 OfoxAI 公开 Models API 校准。",
provider:"供应商",
workload:"示例工作量",
allProviders:"全部供应商",
source:"来源：OfoxAI 公开 Models API。价格可能变化，生产使用前请再次核对。",
footer:"© 2026 AI工具导航",
theme:{light:"浅色",dark:"深色",lightAria:"切换到浅色模式",darkAria:"切换到深色模式"},
labels:{input:"输入",output:"输出",cached:"缓存读取",cache5m:"缓存写入",cache1h:"1小时缓存",search:"搜索",context:"上下文",maxOutput:"最大输出",example:"示例",loading:"正在加载价格数据..."},
workloads:{chat:"聊天：100万输入 + 25万输出",agent:"智能体：300万输入 + 100万缓存 + 80万输出",coding:"编程：200万输入 + 50万缓存 + 100万输出"}
}
}

function escapeHtml(value){
return String(value).replace(/[&<>"']/g,character=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[character]))
}

function updateText(){
let t=text[currentLang]
document.getElementById("title").innerText=t.title
document.getElementById("subtitle").innerText=t.subtitle
document.getElementById("nav_badge").innerText=t.badge
document.getElementById("nav_home").innerText=t.home
document.getElementById("nav_compare").innerText=t.compare
document.getElementById("nav_prices").innerText=t.prices
document.getElementById("nav_about").innerText=t.about
document.getElementById("nav_contact").innerText=t.contact
document.getElementById("nav_submit").innerText=t.submit
document.getElementById("theme_light").innerText=t.theme.light
document.getElementById("theme_dark").innerText=t.theme.dark
document.getElementById("panel_title").innerText=t.panelTitle
document.getElementById("panel_subtitle").innerText=t.panelSubtitle
document.getElementById("provider_label").innerText=t.provider
document.getElementById("workload_label").innerText=t.workload
document.getElementById("source_note").innerText=t.source
document.getElementById("footer").innerText=t.footer
document.getElementById("lang_switch").className="lang-switch " + currentLang
updateThemeSwitch()
}

function renderControls(){
let providerSelect=document.getElementById("price_provider")
let workloadSelect=document.getElementById("price_workload")
let providerValue=providerSelect.value || "All"
let workloadValue=workloadSelect.value || "chat"
let providers=[...new Set(priceModels.map(model=>model.provider))]
providerSelect.innerHTML=`<option value="All">${escapeHtml(text[currentLang].allProviders)}</option>` + providers.map(provider=>`<option value="${escapeHtml(provider)}">${escapeHtml(provider)}</option>`).join("")
providerSelect.value=providers.includes(providerValue) ? providerValue : "All"
workloadSelect.innerHTML=Object.keys(workloads).map(key=>`<option value="${escapeHtml(key)}">${escapeHtml(text[currentLang].workloads[key])}</option>`).join("")
workloadSelect.value=workloads[workloadValue] ? workloadValue : "chat"
}

function formatMoney(value){
if(value===null || value===undefined){
return "-"
}
if(value===0){
return "$0"
}
let decimals=value < 0.01 ? 4 : (value < 1 ? 3 : 2)
return "$" + Number(value).toFixed(decimals).replace(/0+$/,"").replace(/\.$/,"")
}

function getWorkloadCost(model, workloadKey){
let workload=workloads[workloadKey] || workloads.chat
let cachedPrice=model.pricing.cachedInput ?? model.pricing.input
return (workload.input/1000000*model.pricing.input) + (workload.cached/1000000*cachedPrice) + (workload.output/1000000*model.pricing.output)
}

function renderPrices(){
let t=text[currentLang]
let grid=document.getElementById("price_grid")
if(!priceModels.length){
grid.innerHTML=`<div class="price-empty">${escapeHtml(t.labels.loading)}</div>`
return
}
let provider=document.getElementById("price_provider").value || "All"
let workloadKey=document.getElementById("price_workload").value || "chat"
let visibleModels=priceModels.filter(model=>provider==="All" || model.provider===provider)
let maxPrice=Math.max(...visibleModels.flatMap(model=>[
model.pricing.input,
model.pricing.output,
model.pricing.cachedInput || 0,
model.pricing.cacheWrite5m || 0,
model.pricing.cacheWrite1h || 0
]),1)
visibleModels.sort((a,b)=>getWorkloadCost(a,workloadKey)-getWorkloadCost(b,workloadKey))
grid.innerHTML=visibleModels.map(model=>renderPriceCard(model,workloadKey,maxPrice)).join("")
}

function renderPriceCard(model, workloadKey, maxPrice){
let labels=text[currentLang].labels
let rows=[
{label:labels.input,value:model.pricing.input},
{label:labels.output,value:model.pricing.output},
{label:labels.cached,value:model.pricing.cachedInput},
{label:labels.cache5m,value:model.pricing.cacheWrite5m},
{label:labels.cache1h,value:model.pricing.cacheWrite1h},
{label:labels.search,value:model.pricing.webSearch}
].filter(row=>row.value!==null && row.value!==undefined).map(row=>{
let width=row.value ? Math.max((Math.log(row.value+1)/Math.log(maxPrice+1))*100,3) : 0
return `
<div class="price-row">
<span class="price-row-label">${escapeHtml(row.label)}</span>
<span class="price-track"><span class="price-fill" style="--value:${width}"></span></span>
<span class="price-value">${escapeHtml(formatMoney(row.value))}</span>
</div>
`
}).join("")

let cost=getWorkloadCost(model,workloadKey)
return `
<article class="price-card">
<div class="price-card-top">
<div>
<h3>${escapeHtml(model.name)}</h3>
<span class="price-id">${escapeHtml(model.id)}</span>
</div>
<div class="price-cost">${escapeHtml(formatMoney(cost))}</div>
</div>
<div class="price-meta">
<span>${escapeHtml(model.provider)}</span>
<span>${escapeHtml(labels.context)} ${escapeHtml(model.context)}</span>
<span>${escapeHtml(labels.maxOutput)} ${escapeHtml(model.maxOutput)}</span>
</div>
<div class="price-bars">${rows}</div>
<p class="source-note"><strong>${escapeHtml(labels.example)}:</strong> ${escapeHtml(text[currentLang].workloads[workloadKey])}</p>
</article>
`
}

function loadPrices(){
fetch("/data/model-prices.json")
.then(response=>response.json())
.then(data=>{
priceModels=data.models || []
renderControls()
renderPrices()
})
.catch(()=>{
document.getElementById("price_grid").innerHTML=`<div class="price-empty">${escapeHtml(text[currentLang].labels.loading)}</div>`
})
}

updateText()
loadPrices()
</script>

</body>

</html>
